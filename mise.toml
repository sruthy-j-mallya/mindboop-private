[tools]
node = "22.14.0"
pnpm = "11.11.0"
rust = "1.97.1"

[tasks.setup]
description = "Install toolchains and project dependencies"
run = [
  "mise install",
  "pnpm install",
  "cargo fetch --manifest-path src-tauri/Cargo.toml",
]

[tasks.dev]
description = "Run the Tauri app in development mode"
run = "pnpm tauri dev"
